name: Release

# Every push to main: read VERSION; if tag v<VERSION> does not exist yet, build the Windows app and
# publish a GitHub Release (this also creates the tag). Same version again = nothing happens.
# To ship a new version: bump the number in VERSION and push to main.
# Manual run (Actions -> Release -> Run workflow) builds the zip as an artifact only, no release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$VER" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "VERSION '$VER' is not valid semver" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$EVENT" = "push" ]; then
            if gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
              echo "release v$VER already exists"
            elif [ -n "$(git ls-remote --tags origin "refs/tags/v$VER")" ]; then
              echo "tag v$VER already exists without a release" >&2
              exit 1
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, ci]
    if: needs.check.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Python deps
        run: pip install --require-hashes -r requirements.lock

      - name: Package with PyInstaller
        run: pyinstaller ScribSalmon.spec --noconfirm

      - name: Third-party notices and LICENSE
        run: |
          pip install pip-licenses
          pip-licenses --with-license-file --no-license-path --format=plain-vertical --output-file THIRD_PARTY_NOTICES.txt
          Copy-Item THIRD_PARTY_NOTICES.txt dist\ScribSalmon\ -Force
          Copy-Item LICENSE dist\ScribSalmon\ -Force

      - name: Zip and checksum
        run: |
          # the spec already copies the exe.config; this is a harmless safety net
          Copy-Item packaging\ScribSalmon.exe.config dist\ScribSalmon\ -Force
          $zip = "ScribSalmon-v${{ needs.check.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist\ScribSalmon -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-ChildItem ScribSalmon-*.zip, SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ScribSalmon-windows-x64
          path: |
            ScribSalmon-*.zip
            SHA256SUMS.txt

  release:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ScribSalmon-windows-x64
      - name: Create GitHub Release (creates tag v<VERSION> on this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" ScribSalmon-*.zip SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ScribSalmon v${{ needs.check.outputs.version }}" \
            --generate-notes
