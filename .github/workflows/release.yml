name: Release

# Every push to main: read VERSION; if tag v<VERSION> does not exist yet, build the Windows app and
# publish a GitHub Release (this also creates the tag). Same version again = nothing happens.
# To ship a new version: bump the number in VERSION and push to main.
# Manual run (Actions -> Release -> Run workflow) builds the zip as an artifact only, no release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh release view "v$VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: |
          (Get-Content requirements.txt) | Where-Object { $_ -notmatch '^PySide6' } | Set-Content req-ci.txt
          pip install -r req-ci.txt pyinstaller

      - name: Package with PyInstaller
        run: pyinstaller ScribSalmon.spec --noconfirm

      - name: Zip
        run: |
          Compress-Archive -Path dist\ScribSalmon -DestinationPath "ScribSalmon-v${{ needs.check.outputs.version }}-windows-x64.zip"
          Get-ChildItem *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScribSalmon-windows-x64
          path: ScribSalmon-*.zip

  release:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScribSalmon-windows-x64
      - name: Create GitHub Release (creates tag v<VERSION> on this commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" ScribSalmon-*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ScribSalmon v${{ needs.check.outputs.version }}" \
            --generate-notes
