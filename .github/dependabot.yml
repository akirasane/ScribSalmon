version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "numpy"     # capped <2.3 on purpose (audio / Whisper stack compatibility)
      - dependency-name: "*"         # majors are upgraded deliberately (the lock file is what ships)
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
