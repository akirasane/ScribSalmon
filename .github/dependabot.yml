version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "PySide6"   # only used by tools/make_icons.py
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
